<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="C55B Fuel">
<title>C55B Fuel Calculator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#14171c;--pn:#1e232b;--tx:#e8ecf1;--mu:#8f99a8;--or:#ff8a1f;--gn:#4cd08a;--bad:#ff6b6b;--ln:#313845}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f3;--pn:#fff;--tx:#14171c;--mu:#5d6675;--or:#d46a00;--gn:#13804a;--bad:#c62828;--ln:#ccd2db}}
:root[data-theme="dark"]{--bg:#14171c;--pn:#1e232b;--tx:#e8ecf1;--mu:#8f99a8;--or:#ff8a1f;--gn:#4cd08a;--bad:#ff6b6b;--ln:#313845}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input[type=number]{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);font-size:22px;font-weight:600}
#ob{border-color:var(--gn)}.or{border-color:var(--or)!important}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--tx);padding:8px 12px;font-size:14px}
.seg button.on{background:var(--or);color:#14171c;font-weight:600}
h2{font-size:14px;margin:0;color:var(--mu);font-weight:600}
table{width:100%;border-collapse:collapse;text-align:right}
th,td{padding:7px 4px;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left;color:var(--mu)}
th{font-size:12px;color:var(--mu);font-weight:500}
tr.gn td+td{color:var(--gn);font-weight:600}tr.or td+td{color:var(--or);font-weight:600}
.res{text-align:center;padding:6px 0}
.res .t{font-size:13px;color:var(--mu);letter-spacing:1px}
.res .l{font-size:44px;font-weight:800;color:var(--or);line-height:1.1}
.res .s{font-size:20px;font-weight:600;color:var(--or)}
.note{font-size:12px;color:var(--mu);margin-top:6px}
#warn{color:var(--bad);font-weight:600;font-size:14px}
</style></head><body><main>
<h1>Citation Bravo (C55B) - Fuel Uplift</h1>

<div class="panel"><label for="ob">Total fuel on board (lb)</label>
<input type="number" id="ob" inputmode="decimal" placeholder="e.g. 1200"></div>

<div class="panel">
<div class="row"><h2>Fuel desired (lb)</h2><div class="seg"><button id="mB" class="on">Both tanks</button><button id="mT">Per tank</button></div></div>
<div id="dBoth"><label for="dt">Total desired</label><input type="number" id="dt" class="or" inputmode="decimal" placeholder="e.g. 3000"></div>
<div id="dTank" style="display:none"><div class="two"><div><label for="dl">Left tank</label><input type="number" id="dl" class="or" inputmode="decimal"></div><div><label for="dr">Right tank</label><input type="number" id="dr" class="or" inputmode="decimal"></div></div><div class="note" id="dsum"></div></div>
</div>

<div class="panel">
<div class="row"><h2>Density</h2><div class="seg"><button id="bIsa" class="on">ISA 15 &deg;C</button><button id="bOat">Correct for temp</button></div></div>
<div id="tRow" style="display:none"><label for="temp">Fuel temperature / OAT (&deg;C)</label><input type="number" id="temp" value="15" inputmode="decimal"></div>
<div class="note" id="dn"></div>
</div>

<div class="panel">
<div class="res"><div class="t" id="tl">TO UPLIFT</div><div class="l" id="rL">-</div><div class="s" id="rK"></div><div class="s" id="rP"></div></div>
<div id="warn"></div>
<table><tr><th></th><th>lb</th><th>kg</th><th>Litres</th></tr>
<tr class="gn"><td>On board</td><td id="a1">-</td><td id="a2">-</td><td id="a3">-</td></tr>
<tr class="or"><td>Desired</td><td id="b1">-</td><td id="b2">-</td><td id="b3">-</td></tr></table>
<div class="note">Litres = kg / density. Max usable 4,860 lb total (2,430 lb per tank). Aid only - verify against the AFM and the aircraft gauges.</div>
</div>
<div class="note" id="off" style="text-align:center;padding:0 12px 12px">Checking offline status...</div>
</main>
<script>
const LB=0.45359237,MAXS=2430,IMB=200,$=id=>document.getElementById(id);
let both=true,oat=false;
const n=id=>{const v=parseFloat(String($(id).value).replace(',','.'));return isNaN(v)?null:v};
const f=x=>x.toLocaleString(undefined,{maximumFractionDigits:0});
const rho=()=>{const t=n('temp');return oat&&t!==null?0.803-0.00072*(t-15):0.803};
function setRow(i,lb,p){if(lb===null){[1,2,3].forEach(k=>$(i+k).textContent='-');return}const kg=lb*LB;$(i+'1').textContent=f(lb);$(i+'2').textContent=f(kg);$(i+'3').textContent=f(kg/p)}
function render(){
 const p=rho(),ob=n('ob'),dl=n('dl'),dr=n('dr');
 const des=both?n('dt'):(dl===null&&dr===null?null:(dl||0)+(dr||0));
 $('bIsa').classList.toggle('on',!oat);$('bOat').classList.toggle('on',oat);
 $('mB').classList.toggle('on',both);$('mT').classList.toggle('on',!both);
 $('tRow').style.display=oat?'block':'none';$('dBoth').style.display=both?'block':'none';$('dTank').style.display=both?'none':'block';
 $('dsum').textContent=des===null?'':'Total desired: '+f(des)+' lb';
 $('dn').textContent='Density used: '+p.toFixed(3)+' kg/L ('+(p/LB*3.78541).toFixed(2)+' lb/US gal)'+(oat?' at '+(n('temp')??15)+' \u00b0C':' at ISA 15 \u00b0C');
 setRow('a',ob,p);setRow('b',des,p);
 const w=[];
 if(ob===null||des===null){$('rL').textContent='-';$('rK').textContent='';$('rP').textContent='';$('tl').textContent='TO UPLIFT'}
 else{const u=des-ob,a=Math.abs(u),kg=a*LB;
  $('tl').textContent=u<0?'TO DEFUEL':'TO UPLIFT';
  $('rL').textContent=f(kg/p)+' L';$('rK').textContent=f(kg)+' kg';$('rP').textContent=f(a)+' lb';
  if(u<0)w.push('Desired is below fuel on board - defuel needed.')}
 if(ob!==null&&ob>2*MAXS)w.push('Fuel on board exceeds max usable (4,860 lb).');
 if(des!==null&&des>2*MAXS)w.push('Desired exceeds max usable (4,860 lb).');
 if(!both){if((dl||0)>MAXS||(dr||0)>MAXS)w.push('A tank exceeds 2,430 lb.');if(Math.abs((dl||0)-(dr||0))>IMB)w.push('Tank imbalance exceeds 200 lb.')}
 $('warn').innerHTML=w.join('<br>');
}
['ob','dt','dl','dr','temp'].forEach(k=>$(k).addEventListener('input',render));
$('mB').onclick=()=>{both=true;render()};$('mT').onclick=()=>{both=false;render()};
$('bIsa').onclick=()=>{oat=false;render()};$('bOat').onclick=()=>{oat=true;render()};
render();
const off=$('off');
if(!('serviceWorker' in navigator))off.textContent='Offline NOT available: '+(location.protocol!=='https:'?'page is not https':'browser blocks it (Private mode?)');
else navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(async()=>{const k=await (await caches.open('c55b-v9')).keys(),hit=await caches.match(location.href,{ignoreSearch:true,ignoreVary:true}),ctl=!!navigator.serviceWorker.controller;off.textContent=(k.length>=6&&hit&&ctl)?'Offline ready \u2713 (v9)':'Setting up offline (v9): close the app completely and reopen it once while online to finish.'}).catch(e=>{off.textContent='Offline NOT available: '+e.message});
</script></body></html>
